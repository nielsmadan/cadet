[workspace]
resolver = "3"
members = ["crates/core", "crates/backend-markdown", "crates/backend-local-db", "crates/store-sqlite", "crates/app", "crates/cli"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2.0"
ulid = "3.0"
jiff = "0.2"
blake3 = "1.8"
toml_edit = { version = "0.25", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
miette = { version = "7.6", features = ["fancy"] }
# Brief pins "0.40", but rusqlite 0.40.x (and its libsqlite3-sys 0.38.x) use
# the unstable `cfg_select!` macro in their own library source, not just a
# build script, so they cannot compile under this workspace's pinned stable
# rustc (1.93.1, cfg_select not yet stabilised). 0.39.0 is the newest release
# before that macro was introduced; API used here (Connection, execute,
# execute_batch, prepare, query_map, query_row, params!) is identical.
rusqlite = { version = "0.39", features = ["bundled"] }
